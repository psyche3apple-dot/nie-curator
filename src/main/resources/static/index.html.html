<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국립생태원 해설·교육 프로그램 큐레이터</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="chatbot-container">
        <header class="chat-header">
            <h1>나에게 맞는 해설·교육 프로그램 찾기</h1>
            <p>어떤 프로그램이 좋을지 고민되시나요?<br>몇 가지만 알려주시면 조건에 잘 맞는 프로그램을 찾아드릴게요.</p>
        </header>

        <main id="chat-history" class="chat-history">
            <!-- 시작 화면 -->
            <div id="start-screen" class="start-screen">
                <div class="character-area">
                    <img id="character-img" src="assets/characters/image_0.png" alt="국립생태원 에코 큐레이터">
                </div>
                <button id="start-btn" class="primary-btn">프로그램 찾아보기</button>
            </div>
            <!-- 대화 내용이 이곳에 동적으로 추가됩니다 -->
        </main>

        <footer id="chat-actions" class="chat-actions hidden">
            <div id="current-conditions" class="current-conditions">
                <!-- 현재 선택 조건이 태그 형식으로 추가됩니다 -->
            </div>
            <div class="navigation-btns">
                <button id="prev-btn" class="secondary-btn">이전 선택 바꾸기</button>
                <button id="restart-btn" class="secondary-btn">처음부터 다시 찾기</button>
            </div>
        </footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
